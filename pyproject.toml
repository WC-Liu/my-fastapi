[project]
name = "my-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioredis>=2.0.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi-mail>=1.6.4",
    "fastapi[standard]>=0.136.1",
    "itsdangerous>=2.2.0",
    "passlib>=1.7.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "redis>=7.4.0",
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
# 行长度限制（与 Black 默认保持一致）
line-length = 88

# 排除目录
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    ".git",
    ".ruff_cache",
    "tests/fixtures",
]


[tool.ruff.lint]
ignore = ["F401"]
